name: Build DeltaTroll IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-14, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        run: |
          brew install xcodegen ldid-procursus

      - name: Fetch deps
        run: bash Scripts/fetch_deps.sh

      - name: Build IPA
        run: bash Scripts/build_ipa.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeltaTroll-trollstore-${{ matrix.os }}
          path: build/DeltaTroll.trollstore.ipa
          retention-days: 7
